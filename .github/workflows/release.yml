name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package source archive
        run: git archive --format=zip --output=paper-style-deconstruct-${{ github.ref_name }}.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: paper-style-deconstruct-${{ github.ref_name }}.zip
